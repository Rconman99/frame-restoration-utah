<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="canonical" href="https://www.framerestorationutah.com/owner-login">
<title>Frame Restoration Utah — Sign in</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--gold:#c8a951;--red:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:400px;width:90%;text-align:center}
.login-box h1{font-size:1.4rem;margin-bottom:6px;color:var(--gold)}
.login-box .sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.login-box input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1.1rem;text-align:center;letter-spacing:4px;outline:none;margin-bottom:16px}
.login-box input:focus{border-color:var(--gold)}
.login-box input::placeholder{letter-spacing:normal;color:var(--muted)}
.login-btn{width:100%;padding:14px;border:none;border-radius:8px;background:var(--gold);color:#0d1117;font-size:1rem;font-weight:600;cursor:pointer}
.login-btn[disabled]{opacity:.6;cursor:wait}
.login-err{color:var(--red);font-size:.85rem;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<main class="login-box">
  <h1>Frame Restoration Utah</h1>
  <p class="sub">Team sign-in · PIN required</p>
  <form id="ownerLoginForm">
    <label for="pinInput" class="sub">PIN</label>
    <input type="password" id="pinInput" placeholder="Enter PIN" inputmode="numeric" autocomplete="current-password" required>
    <button class="login-btn" id="ownerLoginBtn" type="submit">Sign in</button>
  </form>
  <div class="login-err" id="loginErr" role="alert"></div>
</main>
<script src="/owner-login.js"></script>
</body>
</html>
