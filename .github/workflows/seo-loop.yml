name: SEO loop (Utah)

# The daily measure-and-diff half of the SEO loop (docs/seo/SEO-LOOP.md) —
# method ported from the seo-god skill, implemented natively (no Docker, no
# OpenSEO container, zero npm dependencies).
#
# Every run:
#   1. scripts/seo-snapshot.mjs — live-crawls www.framerestorationutah.com (real
#      status codes, redirect chains, noindex, thin content) + pulls Google
#      Search Console when the GSC_SERVICE_ACCOUNT_JSON secret exists, consumes
#      the committed six-city weekly DataForSEO matrix plus the twelve-city
#      manual expansion baseline (read-only here; this workflow never buys
#      additional SERPs), and writes
#      data/seo/snapshots/<date>.json. A failed crawl writes NO
#      snapshot and fails the job — a fabricated "0 issues" snapshot would
#      read as a clean bill of health in tomorrow's diff.
#   2. scripts/seo-diff.mjs — regression-first diff vs the previous snapshot
#      (regressions -> quick wins at positions 4-15 -> new queries), writes
#      data/seo/readouts/<date>.md, and surfaces experiment candidates shaped
#      for the frame-seo-experiment.v1 protocol. Report-only: this loop NEVER
#      edits pages — content changes stay human decisions behind the
#      compliance gate.
#   3. Commits both. The readout also lands in the job summary.
#
# Deadman: the diff opens with a missed-run warning (+ a ::warning::
# annotation) when the previous snapshot is >48h old, so a silently-dead
# schedule surfaces in the next run's readout instead of never.
#
# Zero-secret degradation: without GSC_SERVICE_ACCOUNT_JSON the crawl half
# still runs daily and GSC sections read "not measured" — never zero.
# Setup for the secret: docs/seo/SEO-LOOP.md §GSC.

on:
  schedule:
    - cron: '37 12 * * *'   # daily ~06:37 Denver (12:37 UTC in MDT) — before
                            # business hours, offset from the other crons
  workflow_dispatch:
  pull_request:
    paths:                  # the suite existed but nothing ran it — a green PR
      - 'scripts/seo-*.mjs' # said nothing about whether the loop still worked
      - 'scripts/lib/gsc.mjs'
      - 'scripts/lib/gsc.test.mjs'
      - 'scripts/seo-snapshot.test.mjs'
      - 'data/rank-tracker/**/*.json'
      - '.github/workflows/seo-loop.yml'

permissions:
  contents: write

concurrency:
  group: seo-loop-utah-${{ github.event.pull_request.number || 'main' }}   # was seo-loop-texas, a porting slip
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/seo-diff.test.mjs scripts/seo-crawl.test.mjs scripts/lib/gsc.test.mjs scripts/lib/slv-gsc-attribution.test.mjs scripts/seo-snapshot.test.mjs

  measure:
    needs: test               # a broken differ must not get to write a snapshot
    if: github.event_name != 'pull_request'   # never push to main from a PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Snapshot (crawl + GSC + committed fixed ranks)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: node scripts/seo-snapshot.mjs

      - name: Diff + readout (regressions first)
        run: node scripts/seo-diff.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh the 18-city exact-query URL attribution ledger
        run: |
          npm run sync:slv-gsc-attribution
          npm run sync:slv-expansion-architecture
          npm run sync:slv-maps-readiness
          npm run sync:slv-interventions
          npm run sync:slv-execution-registry
          npm run audit:slv-gsc-attribution
          npm run audit:slv-expansion-architecture
          npm run audit:slv-maps-readiness
          npm run audit:slv-interventions
          npm run audit:slv-execution-registry

      - name: Add exact-query URL attribution summary
        if: always()
        run: |
          jq -r '"### Salt Lake Valley exact-query URL attribution\n\n- Queries requested: \(.summary.requestedQueries)/72\n- Queries with returned rows: \(.summary.queriesWithRows)\n- Exact query→URL rows: \(.summary.exactRows)\n- Multi-URL queries requiring diagnosis: \(.summary.multiUrlIncludingIntendedQueries + .summary.alternateUrlOnlyQueries)\n- Missing/unreturned rows treated as zero: no\n- Public mutation: no"' data/rank-tracker/SLV-GSC-URL-ATTRIBUTION-LATEST.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if changed
        run: |
          git config user.name "SEO Loop Bot"
          git config user.email "seo-loop-bot@framerestorationutah.com"
          git add data/seo/ \
            data/rank-tracker/SLV-GSC-URL-ATTRIBUTION-LATEST.json \
            data/rank-tracker/SLV-EXPANSION-ARCHITECTURE-2026-08-12.json \
            data/rank-tracker/SLV-MAPS-READINESS-2026-08-12.json \
            data/rank-tracker/SLV-INTERVENTION-QUEUE-2026-08-12.json \
            data/rank-tracker/SLV-EXECUTION-REGISTRY-2026-08-12.json
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "chore(seo): daily snapshot + regression-first readout [skip ci]"
            # Rebase-retry so an overlapping push to main (blog poster, traction
            # refresh) can never drop this commit to a non-fast-forward error.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              echo "push race, retry $i"; sleep 7
            done
            echo "push failed after retries"; exit 1
          fi
