      - 'data/aeo/topic-portfolio-baseline.json'
      - '.vercelignore'
      - 'vercel.json'
      - 'sitemap.xml'
      - '.github/workflows/compliance-gate.yml'
      - '.github/workflows/deploy-edge-function.yml'
      - 'supabase/functions/**'
      - 'supabase/functions/lead-crm/**'
      - 'supabase/functions/weekly-report/**'
      - 'supabase/functions/_shared/crm-access.ts'
      - 'supabase/functions/_shared/crm-access.test.ts'
      - 'supabase/functions/_shared/dashboard-session.ts'
      - 'supabase/functions/_shared/dashboard-session.test.ts'
      - 'supabase/functions/_shared/dashboard-credential.ts'
      - 'supabase/functions/_shared/dashboard-credential.test.ts'
      - 'supabase/functions/resend-webhook/**'
      - 'supabase/functions/lead-notification-worker/**'
      - '.github/workflows/lead-notification-worker.yml'
