name: Compliance Gate

# Enforces the Frame Restoration UT compliance contract on every PR + push to main.
# Ported from TX v2 2026-05-30 and adapted for Utah law + Utah's current corpus.
#
# - compliance-words: BLOCKING — fails on any forbidden-word blocker. Utah basis
#   is the unlicensed-adjusting statute (Utah Code §31A-26-201) + the deductible-
#   rebate ban (§13-50-302), NOT Texas §4102.163. Dictionary +
#   legal provenance: data/route-factory/compliance-words.json +
#   data/route-factory/UTAH-COMPLIANCE-LAW.md. Passes clean on main as of 2026-05-30
#   (patterns scoped to first-person offers; existing copy is compliant).
# - jsonld-validity: BLOCKING — fails if any application/ld+json block doesn't
#   parse. Excludes archive/ build-intelligence/ dashboard/ (internal eval HTML).
#   Passes clean on main (0 invalid / 364 blocks).
# - link-integrity: ADVISORY — UT currently has 17 genuinely-broken internal links
#   (per-city service subpages that don't exist + a ${item.url} template leak +
#   missing city pages). RATCHET: once those are triaged to 0, add `--strict` and
#   remove continue-on-error to make blocking (matches TX).
# - city-quality: BLOCKING (ratchet closed 2026-06-02, PR #72) — corpus-level doorway/thin/duplicate guard. Red-blocks
#   on rating-integrity until the cloned AggregateRating debt is cleared (Phase 2 of
#   the TX→UT port). RATCHET: remove continue-on-error once 45/45 location pages pass.
# - review-integrity: BLOCKING (added 2026-06-03) — the dedicated anti-clone gate.
#   Location pages may carry individual <Review> markup from REAL reviewers only
#   (reviews.json / data/reviews-full.json), and NEVER an AggregateRating. The single
#   evidenced GBP rating belongs only on the homepage. Codifies the compliance line
#   from commit 816c280 and gates the top-10-cities Review-schema rollout.
#
# NOTE: media-provenance (TX media-clearance gate) is intentionally omitted — it
# requires data/image-registry.json, which is TX-specific. Add it here only if UT
# adopts the same media-registry clearance workflow.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '**/*.html'
      - 'llms.txt'
      - 'scripts/audit-claim-registry.mjs'
      - 'scripts/validate-aeo-topic-portfolio.mjs'
      - 'scripts/audit-compliance-words.mjs'
      - 'scripts/audit-links.mjs'
      - 'scripts/audit-jsonld.mjs'
      - 'scripts/repair-faq-visibility.mjs'
      - 'scripts/audit-city-quality.mjs'
      - 'scripts/audit-cta-integrity.mjs'
      - 'scripts/audit-gbp-copy.mjs'
      - 'data/GBP-*.md'
      - 'scripts/audit-review-integrity.mjs'
      - 'scripts/audit-entity-consistency.mjs'
      - 'scripts/audit-doc-isolation.mjs'
      - 'scripts/audit-public-seo-surface.mjs'
      - 'scripts/audit-static-assets.mjs'
      - 'scripts/audit-csp-contract.mjs'
      - 'scripts/validate-mobile-ui-contract.mjs'
      - 'scripts/validate-mobile-contact-corpus.mjs'
      - 'scripts/test-mobile-ui.mjs'
      - 'scripts/normalize-mobile-cta.py'
      - 'scripts/test-lead-form-submit.mjs'
      - 'scripts/audit-dashboard-security.mjs'
      - 'scripts/test-dashboard-session-client.mjs'
      - 'scripts/verify-dashboard-deploy-receipt.mjs'
      - 'scripts/test-dashboard-deploy-receipt.mjs'
      - 'scripts/**'
      - 'scripts/verify-client-ip-deploy-receipt.mjs'
      - 'scripts/test-client-ip-deploy-receipt.mjs'
      - 'scripts/render-client-ip-probe.mjs'
      - 'scripts/audit-client-ip-probe-contract.mjs'
      - 'supabase/probe-templates/**'
      - 'scripts/verify-owner-notification-deploy-receipt.mjs'
      - 'scripts/run-owner-notification-deploy-canaries.mjs'
      - 'scripts/test-owner-notification-deploy-receipt.mjs'
      - 'scripts/check-cta-liveness.py'
      - 'scripts/update-google-reviews.py'
      - 'scripts/sync-shared-asset-versions.mjs'
      - 'scripts/shared-asset-versions.json'
      - 'scripts/generate-blog-post.py'
      - 'global.css'
      - 'global-critical.css'
      - 'global-modal.js'
      - 'images/**'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.md'
