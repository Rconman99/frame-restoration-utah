name: Deploy UT Supabase Edge Function

# Phase 4 of the TX→UT systems port. Manual-only. Deploys ONE edge function to the
# Utah Supabase project (hdcflshhomzildwqlmwh) using the production environment's
# SUPABASE_ACCESS_TOKEN, so deploys don't depend on a local CLI / MCP login.
# workflow_dispatch only — never runs on push.
#
# Production environment secrets required: SUPABASE_ACCESS_TOKEN, dashboard
# receipt token/key, owner-notification receipt HMAC key, client-IP receipt
# token, and LEAD_NOTIFICATION_WORKER_TOKEN. The client-IP Ed25519 public key
# is a Production environment variable; no private signing key enters CI.
# The client-IP token is issued separately from controlled dual-stack evidence; the
# owner-notification token is minted here from fresh no-send evidence. Receipt
# keys and canary secrets are never workflow inputs or command-line arguments.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Edge function to deploy"
        required: true
        default: track-click
        # Allowlist (not free-form) — constrains the value injected into the deploy
        # shell to known UT functions, closing the shell-injection vector on a
        # token-carrying workflow.
        type: choice
        options:
          - track-click
          - handle-lead
          - lead-crm
          - review-request
          - handle-call
          - handle-sms
          - outbound-call
          - send-message
          - resend-webhook
          - lead-notification-worker
          - weekly-report
          - inbound-media
          - sms-fallback
      receipt_nonce:
        description: "Exact nonce embedded in the single-use client-IP receipt"
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: utah-production-edge-function-deploy
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production – frame-restoration-utah
    steps:
      # actions/checkout v4, immutable official commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact production function allowlist
        env:
          FUNCTION_NAME: ${{ inputs.function }}
        run: |
          set -euo pipefail
          case "$FUNCTION_NAME" in
            track-click|handle-lead|lead-crm|review-request|handle-call|handle-sms|outbound-call|send-message|resend-webhook|lead-notification-worker|weekly-report)
              ;;
            *)
              echo "::error::Function is not in the reviewed production deploy allowlist"
              exit 1
              ;;
          esac
      - name: Require the exact current main tip and green compliance
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Production deploys must be dispatched from refs/heads/main"
            exit 1
          }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid deployment SHA"
            exit 1
          }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          [[ "$DEPLOY_SHA" == "$MAIN_SHA" ]] || {
            echo "::error::Selected SHA is not the current origin/main tip"
            exit 1
          }

          RUNS_JSON="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/compliance-gate.yml/runs" \
            -f head_sha="$DEPLOY_SHA" -f event=push -f status=success -f per_page=20)"
          RUN_ID="$(jq -er --arg sha "$DEPLOY_SHA" '
            [.workflow_runs[]
              | select(.head_sha == $sha and .head_branch == "main"
                and .event == "push" and .status == "completed"
                and .conclusion == "success")]
            | sort_by(.run_number) | last | .id
          ' <<<"$RUNS_JSON")" || {
            echo "::error::No successful main-push Compliance Gate run exists for the exact deployment SHA"
            exit 1
          }
          JOBS_JSON="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" -f per_page=100)"
          jq -e '
            (.jobs | length > 0)
            and ([.jobs[] | select(.status != "completed" or .conclusion != "success")] | length == 0)
            and ([.jobs[] | select(.name == "Dashboard session revocation + credential security (blocking)"
              and .status == "completed" and .conclusion == "success")] | length == 1)
          ' <<<"$JOBS_JSON" >/dev/null || {
            echo "::error::Exact-SHA compliance jobs are incomplete, failed, skipped, or missing dashboard-security"
            exit 1
          }
      # supabase/setup-cli v1, immutable official commit; CLI stays exact below.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.113.0
      - name: Verify function source exists
        run: |
          test -f "supabase/functions/${{ inputs.function }}/index.ts" \
            || { echo "::error::supabase/functions/${{ inputs.function }}/index.ts not found"; exit 1; }
      - name: Read live dashboard migration and secret state
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
        run: |
          set -euo pipefail
          MIGRATION_HISTORY_PATH="$RUNNER_TEMP/utah-dashboard-migrations.json"
          SECRETS_METADATA_PATH="$RUNNER_TEMP/utah-edge-secrets.json"
          echo "MIGRATION_HISTORY_PATH=$MIGRATION_HISTORY_PATH" >> "$GITHUB_ENV"
          echo "SECRETS_METADATA_PATH=$SECRETS_METADATA_PATH" >> "$GITHUB_ENV"
          if [[ "$FUNCTION_NAME" != "lead-crm" && "$FUNCTION_NAME" != "weekly-report" ]]; then
            printf '[]\n' > "$MIGRATION_HISTORY_PATH"
            printf '[]\n' > "$SECRETS_METADATA_PATH"
            exit 0
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from the production environment"
            exit 1
          }
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --header "User-Agent: SupabaseCLI/2.113.0" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > "$MIGRATION_HISTORY_PATH" <<'JSON'
          {"query":"select m.version::text as version, not exists (select 1 from public.report_access as ra where ra.pin is not null) as report_access_pins_all_null, exists (select 1 from pg_catalog.pg_constraint as c where c.conrelid = 'public.report_access'::regclass and c.conname = 'report_access_plaintext_pin_forbidden_check' and c.contype = 'c' and c.convalidated) as plaintext_pin_constraint_present from supabase_migrations.schema_migrations as m where m.version::text in ('20260807000140','20260807000150') order by m.version::text","read_only":true}
          JSON
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$SECRETS_METADATA_PATH"
          chmod 600 "$MIGRATION_HISTORY_PATH" "$SECRETS_METADATA_PATH"
      - name: Require the live missed-call schema before call or SMS deployment
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
        run: |
          set -euo pipefail
          if [[ "$FUNCTION_NAME" != "handle-call" && "$FUNCTION_NAME" != "handle-sms" ]]; then
            exit 0
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from the production environment"
            exit 1
          }
          STATE_PATH="$RUNNER_TEMP/utah-missed-call-schema.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --header "User-Agent: SupabaseCLI/2.113.0" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > "$STATE_PATH" <<'JSON'
          {"query":"select exists (select 1 from supabase_migrations.schema_migrations where version::text = '20260812010000') as migration_recorded, to_regclass('public.alert_suppressed_callers') is not null as suppression_table_present, exists (select 1 from pg_catalog.pg_class where oid = 'public.alert_suppressed_callers'::regclass and relrowsecurity) as suppression_rls_enabled, exists (select 1 from pg_catalog.pg_constraint where conrelid = 'public.alert_suppressed_callers'::regclass and conname = 'alert_suppressed_callers_phone_e164_check' and convalidated) as phone_constraint_validated, exists (select 1 from pg_catalog.pg_attribute where attrelid = 'public.call_logs'::regclass and attname = 'missed_alert_sent_at' and not attisdropped) as sent_at_column_present, exists (select 1 from pg_catalog.pg_attribute where attrelid = 'public.call_logs'::regclass and attname = 'missed_alert_message_sid' and not attisdropped) as message_sid_column_present, not has_table_privilege('anon', 'public.alert_suppressed_callers', 'select') and not has_table_privilege('authenticated', 'public.alert_suppressed_callers', 'select') as browser_select_revoked, has_table_privilege('service_role', 'public.alert_suppressed_callers', 'select') and has_table_privilege('service_role', 'public.alert_suppressed_callers', 'insert') and has_table_privilege('service_role', 'public.alert_suppressed_callers', 'update') as service_role_access_present","read_only":true}
          JSON
          chmod 600 "$STATE_PATH"
          jq -e '
            length == 1
            and .[0].migration_recorded == true
            and .[0].suppression_table_present == true
            and .[0].suppression_rls_enabled == true
            and .[0].phone_constraint_validated == true
            and .[0].sent_at_column_present == true
            and .[0].message_sid_column_present == true
            and .[0].browser_select_revoked == true
            and .[0].service_role_access_present == true
          ' "$STATE_PATH" >/dev/null || {
            echo "::error::Missed-call migration/schema gate is incomplete; do not deploy $FUNCTION_NAME"
            exit 1
          }
      - name: Verify signed dashboard deployment evidence
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          DEPLOY_SHA: ${{ github.sha }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
          DASHBOARD_DEPLOY_RECEIPT_TOKEN: ${{ secrets.DASHBOARD_DEPLOY_RECEIPT_TOKEN }}
          DASHBOARD_DEPLOY_RECEIPT_HMAC_KEY: ${{ secrets.DASHBOARD_DEPLOY_RECEIPT_HMAC_KEY }}
        run: node scripts/verify-dashboard-deploy-receipt.mjs
      - name: Read live owner-notification migration, secret, and function state
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
        run: |
          set -euo pipefail
          NOTIFICATION_MIGRATION_HISTORY_PATH="$RUNNER_TEMP/utah-notification-migrations.json"
          NOTIFICATION_SECRETS_METADATA_PATH="$RUNNER_TEMP/utah-notification-secrets.json"
          NOTIFICATION_FUNCTIONS_METADATA_PATH="$RUNNER_TEMP/utah-notification-functions.json"
          NOTIFICATION_CANARY_PATH="$RUNNER_TEMP/utah-notification-canaries.json"
          echo "NOTIFICATION_MIGRATION_HISTORY_PATH=$NOTIFICATION_MIGRATION_HISTORY_PATH" >> "$GITHUB_ENV"
          echo "NOTIFICATION_SECRETS_METADATA_PATH=$NOTIFICATION_SECRETS_METADATA_PATH" >> "$GITHUB_ENV"
          echo "NOTIFICATION_FUNCTIONS_METADATA_PATH=$NOTIFICATION_FUNCTIONS_METADATA_PATH" >> "$GITHUB_ENV"
          echo "NOTIFICATION_CANARY_PATH=$NOTIFICATION_CANARY_PATH" >> "$GITHUB_ENV"
          if [[ "$FUNCTION_NAME" != "handle-lead" && "$FUNCTION_NAME" != "resend-webhook" && "$FUNCTION_NAME" != "lead-notification-worker" ]]; then
            printf '[]\n' > "$NOTIFICATION_MIGRATION_HISTORY_PATH"
            printf '[]\n' > "$NOTIFICATION_SECRETS_METADATA_PATH"
            printf '[]\n' > "$NOTIFICATION_FUNCTIONS_METADATA_PATH"
            printf '{}\n' > "$NOTIFICATION_CANARY_PATH"
            exit 0
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from the production environment"
            exit 1
          }
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --header "User-Agent: SupabaseCLI/2.113.0" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > "$NOTIFICATION_MIGRATION_HISTORY_PATH" <<'JSON'
          {"query":"select version::text as version from supabase_migrations.schema_migrations where version::text in ('20260807000100','20260807000160','20260807000165') order by version::text","read_only":true}
          JSON
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$NOTIFICATION_SECRETS_METADATA_PATH"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$NOTIFICATION_FUNCTIONS_METADATA_PATH"
          printf '{}\n' > "$NOTIFICATION_CANARY_PATH"
          chmod 600 \
            "$NOTIFICATION_MIGRATION_HISTORY_PATH" \
            "$NOTIFICATION_SECRETS_METADATA_PATH" \
            "$NOTIFICATION_FUNCTIONS_METADATA_PATH" \
            "$NOTIFICATION_CANARY_PATH"
      - name: Run no-send owner-notification deployment canaries
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
          LEAD_NOTIFICATION_WORKER_TOKEN: ${{ secrets.LEAD_NOTIFICATION_WORKER_TOKEN }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: node scripts/run-owner-notification-deploy-canaries.mjs
      - name: Refresh live owner-notification metadata after canaries
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
        run: |
          set -euo pipefail
          if [[ "$FUNCTION_NAME" != "handle-lead" && "$FUNCTION_NAME" != "resend-webhook" && "$FUNCTION_NAME" != "lead-notification-worker" ]]; then
            exit 0
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from the production environment"
            exit 1
          }
          umask 077
          FRESH_MIGRATIONS="$RUNNER_TEMP/utah-notification-migrations-fresh.json"
          FRESH_SECRETS="$RUNNER_TEMP/utah-notification-secrets-fresh.json"
          FRESH_FUNCTIONS="$RUNNER_TEMP/utah-notification-functions-fresh.json"
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --header "User-Agent: SupabaseCLI/2.113.0" \
            --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > "$FRESH_MIGRATIONS" <<'JSON'
          {"query":"select version::text as version from supabase_migrations.schema_migrations where version::text in ('20260807000100','20260807000160','20260807000165') order by version::text","read_only":true}
          JSON
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$FRESH_SECRETS"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$FRESH_FUNCTIONS"
          chmod 600 "$FRESH_MIGRATIONS" "$FRESH_SECRETS" "$FRESH_FUNCTIONS"
          mv "$FRESH_MIGRATIONS" "$NOTIFICATION_MIGRATION_HISTORY_PATH"
          mv "$FRESH_SECRETS" "$NOTIFICATION_SECRETS_METADATA_PATH"
          mv "$FRESH_FUNCTIONS" "$NOTIFICATION_FUNCTIONS_METADATA_PATH"
      - name: Mint signed live owner-notification deployment evidence
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          DEPLOY_SHA: ${{ github.sha }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
          LEAD_NOTIFICATION_DEPLOY_RECEIPT_HMAC_KEY: ${{ secrets.LEAD_NOTIFICATION_DEPLOY_RECEIPT_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [[ "$FUNCTION_NAME" != "handle-lead" && "$FUNCTION_NAME" != "resend-webhook" && "$FUNCTION_NAME" != "lead-notification-worker" ]]; then
            echo "Owner-notification deployment evidence is not required for this function."
            exit 0
          fi
          RECEIPT_PATH="$RUNNER_TEMP/utah-owner-notification-deploy-receipt.token"
          node scripts/verify-owner-notification-deploy-receipt.mjs --issue "$RECEIPT_PATH"
          RECEIPT_TOKEN="$(tr -d '\r\n' < "$RECEIPT_PATH")"
          [[ -n "$RECEIPT_TOKEN" ]] || {
            echo "::error::owner-notification receipt issuer produced an empty token"
            exit 1
          }
          echo "::add-mask::$RECEIPT_TOKEN"
          printf 'LEAD_NOTIFICATION_DEPLOY_RECEIPT_TOKEN=%s\n' "$RECEIPT_TOKEN" >> "$GITHUB_ENV"
          rm -f "$RECEIPT_PATH"
      - name: Verify signed live owner-notification deployment evidence
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          DEPLOY_SHA: ${{ github.sha }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
          LEAD_NOTIFICATION_DEPLOY_RECEIPT_TOKEN: ${{ env.LEAD_NOTIFICATION_DEPLOY_RECEIPT_TOKEN }}
          LEAD_NOTIFICATION_DEPLOY_RECEIPT_HMAC_KEY: ${{ secrets.LEAD_NOTIFICATION_DEPLOY_RECEIPT_HMAC_KEY }}
        run: node scripts/verify-owner-notification-deploy-receipt.mjs

  # Fresh job boundary: repository-controlled admission/canary/verifier code
  # cannot persist shell environment or command-path hooks into the production
  # deployment shell.
  deploy:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production – frame-restoration-utah
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.113.0
      - name: Verify function source exists in fresh deploy job
        run: |
          test -f "supabase/functions/${{ inputs.function }}/index.ts" \
            || { echo "::error::supabase/functions/${{ inputs.function }}/index.ts not found"; exit 1; }
      - name: Deploy ${{ inputs.function }} to UT project
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hdcflshhomzildwqlmwh
          CLIENT_IP_DEPLOY_DISPATCH_NONCE: ${{ inputs.receipt_nonce }}
          CLIENT_IP_DEPLOY_RECEIPT_TOKEN: ${{ secrets.CLIENT_IP_DEPLOY_RECEIPT_TOKEN }}
          CLIENT_IP_DEPLOY_RECEIPT_PUBLIC_KEY_SPKI_DER_BASE64: ${{ vars.CLIENT_IP_DEPLOY_RECEIPT_PUBLIC_KEY_SPKI_DER_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          SUPABASE_TOKEN_VALUE="${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is missing}"
          GH_TOKEN_VALUE="${GH_TOKEN:?GH_TOKEN is missing}"
          RECEIPT_TOKEN_VALUE="$CLIENT_IP_DEPLOY_RECEIPT_TOKEN"
          RECEIPT_PUBLIC_KEY_VALUE="$CLIENT_IP_DEPLOY_RECEIPT_PUBLIC_KEY_SPKI_DER_BASE64"
          unset \
            SUPABASE_ACCESS_TOKEN \
            GH_TOKEN \
            CLIENT_IP_DEPLOY_RECEIPT_TOKEN \
            CLIENT_IP_DEPLOY_RECEIPT_PUBLIC_KEY_SPKI_DER_BASE64
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]] || {
            echo "::error::checked-out worktree is not the exact deployment SHA"
            exit 1
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "::error::deployment worktree is dirty"
            exit 1
          }
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          env -i PATH="$PATH" HOME="$HOME" \
            node scripts/audit-client-ip-probe-contract.mjs
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]] || {
            echo "::error::scanner changed the checked-out deployment SHA"
            exit 1
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "::error::scanner changed the deployment worktree"
            exit 1
          }
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          LIVE_MAIN_SHA="$(GH_TOKEN="$GH_TOKEN_VALUE" gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$LIVE_MAIN_SHA" == "$DEPLOY_SHA" ]] || {
            echo "::error::origin/main moved after final source integrity checks"
            exit 1
          }

          CLIENT_IP_FINAL_FUNCTIONS_PATH="$RUNNER_TEMP/utah-client-ip-final-functions.json"
          CLIENT_IP_FINAL_SECRETS_PATH="$RUNNER_TEMP/utah-client-ip-final-secrets.json"
          export CLIENT_IP_FINAL_FUNCTIONS_PATH CLIENT_IP_FINAL_SECRETS_PATH
          trap 'rm -f "$CLIENT_IP_FINAL_FUNCTIONS_PATH" "$CLIENT_IP_FINAL_SECRETS_PATH"' EXIT
          SUPABASE_ACCESS_TOKEN="$SUPABASE_TOKEN_VALUE" \
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$CLIENT_IP_FINAL_FUNCTIONS_PATH"
          SUPABASE_ACCESS_TOKEN="$SUPABASE_TOKEN_VALUE" \
            supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            > "$CLIENT_IP_FINAL_SECRETS_PATH"
          chmod 600 "$CLIENT_IP_FINAL_FUNCTIONS_PATH" "$CLIENT_IP_FINAL_SECRETS_PATH"
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            FUNCTION_NAME="$FUNCTION_NAME" \
            DEPLOY_SHA="$DEPLOY_SHA" \
            SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" \
            CLIENT_IP_DEPLOY_DISPATCH_NONCE="$CLIENT_IP_DEPLOY_DISPATCH_NONCE" \
            CLIENT_IP_DEPLOY_RECEIPT_TOKEN="$RECEIPT_TOKEN_VALUE" \
            CLIENT_IP_DEPLOY_RECEIPT_PUBLIC_KEY_SPKI_DER_BASE64="$RECEIPT_PUBLIC_KEY_VALUE" \
            CLIENT_IP_FINAL_FUNCTIONS_PATH="$CLIENT_IP_FINAL_FUNCTIONS_PATH" \
            CLIENT_IP_FINAL_SECRETS_PATH="$CLIENT_IP_FINAL_SECRETS_PATH" \
            node scripts/verify-client-ip-deploy-receipt.mjs
          SUPABASE_ACCESS_TOKEN="$SUPABASE_TOKEN_VALUE" \
            supabase functions deploy "${{ inputs.function }}" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt --use-api
