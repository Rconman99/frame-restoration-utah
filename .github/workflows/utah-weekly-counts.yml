name: Utah weekly counts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-contract:
    name: Utah aggregate counts (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Guard SQL and test the runner without a database
        run: |
          node scripts/audit-utah-weekly-counts.mjs
          node --test scripts/utah-weekly-counts.test.mjs
