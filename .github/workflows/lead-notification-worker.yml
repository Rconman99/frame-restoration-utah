name: Utah Lead Notification Recovery

on:
  # SCHEDULE RESTORED 2026-10-16. The 2026-08-19 pg_cron replacement
  # (supabase/migrations/20260819000000_pgcron_lead_notification_worker.sql)
  # is NOT active in production: pg_cron/pg_net were not installed on 10/16
  # (read-only check), so nothing was retrying missed owner notifications.
  # Double-run safety: the worker claims each job via its claim RPC with
  # claim_version + lease, so overlapping runs cannot send twice. Still, if
  # pg_cron is ever enabled, remove this schedule or run
  # `select cron.unschedule('lead-notification-worker');` so only one scheduler owns it.
  schedule:
    # Every 15 minutes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Health-only check: no claims, no sends"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: utah-lead-notification-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry pending or interrupted owner notifications
        env:
          WORKER_TOKEN: ${{ secrets.LEAD_NOTIFICATION_WORKER_TOKEN }}
          WORKER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'health-only' || 'recover' }}
        run: |
          test -n "$WORKER_TOKEN" || { echo "::error::LEAD_NOTIFICATION_WORKER_TOKEN is missing"; exit 1; }
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if ! HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $WORKER_TOKEN" \
              --header "x-frame-worker-mode: $WORKER_MODE" \
              https://hdcflshhomzildwqlmwh.supabase.co/functions/v1/lead-notification-worker)"; then
            echo "::error::Lead notification worker request failed before an HTTP receipt was returned"
            exit 1
          fi
          # Counts only: never print lead or recipient details.
          python3 -c 'import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({"mode":sys.argv[2],**{k:v for k,v in d.items() if isinstance(v,(int,float,bool)) and not isinstance(v,str)}}))' "$RESPONSE_FILE" "$WORKER_MODE" || echo "::warning::response was not JSON"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Lead notification worker is unhealthy (HTTP $HTTP_STATUS); inspect the counts above"
            exit 1
          fi
