name: Utah Lead Notification Recovery

on:
  # 15-MINUTE CADENCE MOVED TO SUPABASE pg_cron (2026-11-18, prep for making this
  # repo private without GitHub Actions overage). Owner:
  # supabase/migrations/20261118000000_pgcron_lead_notification_worker_v2.sql,
  # job 'lead-notification-worker' at 7,22,37,52 * * * *.
  # MERGE THIS ONLY AFTER that pg_cron job is live and has answered 2xx; until
  # then the old 15-minute GitHub schedule must stay on main.
  # This workflow keeps ONE daily recover run as a safety net and as the alert
  # path: the worker answers non-2xx on terminal/stale notification state, and a
  # failed scheduled run emails the repo owner. ~30 billed min/month.
  # Double-run safety: the worker claims each job via its claim RPC with
  # claim_version + lease, so pg_cron and this run overlapping cannot send twice.
  # ROLLBACK: restore cron '7,22,37,52 * * * *' below and run
  # `select cron.unschedule('lead-notification-worker');` so only one scheduler owns it.
  schedule:
    # Daily safety-net sweep, 08:07 MST / 09:07 MDT (15:07 UTC).
    - cron: '7 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Health-only check: no claims, no sends"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: utah-lead-notification-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry pending or interrupted owner notifications
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          WORKER_TOKEN: ${{ secrets.LEAD_NOTIFICATION_WORKER_TOKEN }}
        run: |
          test -n "$WORKER_TOKEN" || { echo "::error::LEAD_NOTIFICATION_WORKER_TOKEN is missing"; exit 1; }
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if ! HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $WORKER_TOKEN" \
              --header "x-frame-worker-mode: recover" \
              https://hdcflshhomzildwqlmwh.supabase.co/functions/v1/lead-notification-worker)"; then
            echo "::error::Lead notification worker request failed before an HTTP receipt was returned"
            exit 1
          fi
          # Counts only: never print lead or recipient details.
          python3 -c 'import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({"mode":sys.argv[2],**{k:v for k,v in d.items() if isinstance(v,(int,float,bool)) and not isinstance(v,str)}}))' "$RESPONSE_FILE" recover || echo "::warning::response was not JSON"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Lead notification worker is unhealthy (HTTP $HTTP_STATUS); inspect the counts above"
            exit 1
          fi
      - name: Dry run (health-only, no claims or sends)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          WORKER_TOKEN: ${{ secrets.LEAD_NOTIFICATION_WORKER_TOKEN }}
        run: |
          test -n "$WORKER_TOKEN" || { echo "::error::LEAD_NOTIFICATION_WORKER_TOKEN is missing"; exit 1; }
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if ! HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $WORKER_TOKEN" \
              --header "x-frame-worker-mode: health-only" \
              https://hdcflshhomzildwqlmwh.supabase.co/functions/v1/lead-notification-worker)"; then
            echo "::error::Lead notification worker request failed before an HTTP receipt was returned"
            exit 1
          fi
          # Counts only: never print lead or recipient details.
          python3 -c 'import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({"mode":sys.argv[2],**{k:v for k,v in d.items() if isinstance(v,(int,float,bool)) and not isinstance(v,str)}}))' "$RESPONSE_FILE" health-only || echo "::warning::response was not JSON"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Lead notification worker is unhealthy (HTTP $HTTP_STATUS); inspect the counts above"
            exit 1
          fi
