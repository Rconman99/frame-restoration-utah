name: SEO quality checks (non-blocking)

# Warning-only checks on every PR (Grok Bot, via the cowork/ lane):
#   1. Structured-data required fields: LocalBusiness/RoofingContractor need
#      name + address, Service needs name/serviceType + provider. JSON-LD that
#      does not parse is still caught (and blocks) in compliance-gate.yml via
#      scripts/audit-jsonld.mjs.
#   2. CrUX origin p75 LCP / INP / CLS for www.framerestorationutah.com, using
#      the CRUX_API_KEY repository secret. Skips cleanly if the secret is unset.
# Both steps use continue-on-error and the scripts exit 0, so this workflow
# never blocks a merge. Do not flip the schema audit to --strict until the
# owner decides the Salt Lake City service-area profile: validate-slc-identity
# forbids a storefront address on that RoofingContractor, and the noindex
# preview copies the same node. Those two required-field warnings are policy,
# not missing facts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-crux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Unit tests for the schema checker
        continue-on-error: true
        run: node --test scripts/test-audit-schema-fields.mjs
      - name: Structured-data required fields (warnings only)
        continue-on-error: true
        run: node scripts/audit-schema-fields.mjs
      - name: CrUX origin Core Web Vitals (warnings only)
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: node scripts/check-crux.mjs
