name: hook-guards
on:
  pull_request:
    paths: [".claude/**", ".cursor/**", "scripts/test/hooks.test.mjs", ".github/workflows/hook-guards.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hook-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm run test:hooks
