name: hook-guards

# Small blocking guards that are cheap enough to run on their own workflow.
# Nothing here is read back by a source-pinning script, so steps can be added
# without re-syncing a receipt (compliance-gate.yml is pinned; this is not).
#
#   hook-fixtures   the .claude / .cursor hook fixtures still behave
#   roof-calculator the roof size calculator publishes no dollar figure
#                   (owner rule: no prices on a contractor site, 2026-11-25)
#   no-prices       no served customer-facing page publishes a dollar figure
#                   for Frame's work. Same owner rule, whole-corpus. The scan
#                   covers everything outside blog/; the blog sweep ships on its
#                   own branch and turns blog/ on by flipping SCAN_BLOG in
#                   scripts/no-published-prices.test.mjs.
#   blog-no-prices  no blog post publishes a dollar figure, apart from the cited
#                   third-party figures allowlisted in the test (same owner rule)
#   lead-migration-runner
#                   scripts/run-lead-migrations.sh (the exact-target runner for
#                   20261027221000 / 20261027230000 / 20261122230000) still fails
#                   closed on every gate. Runs the real runner against a
#                   throwaway git repository and a stub `supabase` executable;
#                   no Supabase project is contacted and no migration is applied.
#                   It lives here rather than in compliance-gate.yml because that
#                   workflow is digest-pinned by
#                   scripts/audit-client-ip-probe-contract.mjs.
#   lead-migration-probe
#                   the REAL catalog-probe SELECT inside
#                   scripts/run-lead-migrations.sh, and the runner's own jq
#                   validator and COMMIT-before-history detector extracted from
#                   it, run against a throwaway postgres:16-alpine carrying the
#                   real Utah baselines — including the state where
#                   20261027230000 is applied with its history row missing. The
#                   stub-driven suite discards that SQL, so without this job it
#                   is never executed anywhere.
#   lead-migration-rollback
#                   the rollback SQL printed in
#                   docs/runbooks/utah-lead-migrations.md really does leave the
#                   catalog AND supabase_migrations.schema_migrations agreeing,
#                   on a throwaway postgres:16-alpine with the real Utah
#                   baselines. No market project is touched.

on:
  pull_request:
    paths:
      - ".claude/**"
      - ".cursor/**"
      - "scripts/test/hooks.test.mjs"
      - ".github/workflows/hook-guards.yml"
      - "assets/roof-cost-calculator.js"
      - "pages/roof-cost-calculator.html"
      - "scripts/roof-cost-calculator.test.mjs"
      - "scripts/no-published-prices.test.mjs"
      - "scripts/no-published-prices-blog.test.mjs"
      - "scripts/run-lead-migrations.sh"
      - "scripts/run-lead-migrations.test.mjs"
      - "supabase/migrations/20261027221000_lead_spam_classification.sql"
      - "supabase/migrations/20261027230000_ai_referrer_tagging.sql"
      - "supabase/migrations/20261122230000_leads_intake_zip_city_source.sql"
      - "supabase/migration-baselines/remote-applied-history-guard.sql"
      - "supabase/tests/lead_migrations_rollback*.sql"
      - "scripts/test-lead-migration-probe.mjs"
      - "supabase/migrations/20260401000003_baseline_leads.sql"
      - "supabase/migrations/20260401000004_baseline_phone_clicks.sql"
      - "supabase/migrations/20260510_add_attribution_columns.sql"
      - "docs/runbooks/utah-lead-migrations.md"
      - "index.html"
      - "404.html"
      - "review.html"
      - "privacy.html"
      - "terms.html"
      - "thank-you.html"
      - "pages/**"
      - "locations/**"
      - "projects/**"
      - "blog/**"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hook-fixtures:
    runs-on: ${{ fromJSON(vars.FRAME_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:hooks
  roof-calculator:
    name: Roof calculator publishes no price
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:roof-calculator
  no-published-prices:
    name: Served pages publish no price
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:no-published-prices
  blog-no-prices:
    name: Blog publishes no price
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:no-prices-blog
  lead-migration-runner:
    name: Lead migration runner fails closed on every gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run test:lead-migration-runner
  lead-migration-probe:
    name: Real catalog probe SQL and validator agree on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Execute the probe SELECT and the runner's own jq programs
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
        # No PGDATABASE on purpose: the contract refuses to run unless it can
        # create and drop its own disposable database, so it can never apply
        # migrations or perturb catalogs in a database the caller chose.
        run: node scripts/test-lead-migration-probe.mjs
  lead-migration-rollback:
    name: Documented lead-migration rollback leaves catalog and history agreeing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Real baselines, three targets applied with -1, then the runbook's rollback
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260401000003_baseline_leads.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260401000004_baseline_phone_clicks.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260510_add_attribution_columns.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/lead_migrations_rollback_fixture.sql
          psql -h localhost -U postgres -1 -v ON_ERROR_STOP=1 -f supabase/migrations/20261027221000_lead_spam_classification.sql
          psql -h localhost -U postgres -1 -v ON_ERROR_STOP=1 -f supabase/migrations/20261027230000_ai_referrer_tagging.sql
          psql -h localhost -U postgres -1 -v ON_ERROR_STOP=1 -f supabase/migrations/20261122230000_leads_intake_zip_city_source.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/lead_migrations_rollback.sql
