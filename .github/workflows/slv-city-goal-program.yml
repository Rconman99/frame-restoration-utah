permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate all six city goals against current evidence
        run: npm run audit:slv-city-goals

      - name: Validate the owner-gated five-page remediation packet
        run: npm run audit:slv-public-remediation-packet

      - name: Validate all five city architecture diagnoses and held actions
        run: npm run audit:slv-city-architecture

      - name: Validate the full 18-city number-one goal portfolio
        run: npm run audit:slv-18-city-goals

      - name: Validate the pinned 12-city expansion integrity audit
        run: npm run audit:slv-expansion-integrity

      - name: Validate the measured 12-city expansion priority ledger
        run: npm run audit:slv-expansion-priority

      - name: Validate entity health, weekly decisions, and execution registry
        run: |
          npm run audit:slv-entity-health
          npm run audit:slv-weekly-decisions
          npm run audit:slv-consumer-ai
          npm run audit:slv-gsc-attribution
          npm run audit:slv-expansion-architecture
          npm run audit:slv-competitor-displacement
          npm run audit:slv-maps-readiness
          npm run audit:slv-interventions
          npm run audit:slv-execution-registry
