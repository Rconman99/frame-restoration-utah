name: Salt Lake Valley DataForSEO rank tracker

on:
  schedule:
    # Weekly Monday 9:00 UTC. One stable mobile panel is more useful than daily noise.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slv-dataforseo-rank-tracker
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Test tracker parsing and fail-closed behavior
        run: node scripts/test-dataforseo-rank-tracker.mjs

      - name: Validate the fixed Salt Lake Valley matrix without provider spend
        run: node scripts/dataforseo-rank-tracker.mjs --registry data/rank-tracker/panels.json --dry-run

      - name: Measure the complete Salt Lake Valley matrix
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/dataforseo-rank-tracker.mjs --registry data/rank-tracker/panels.json

      - name: Refresh the six-city goal contract from the complete matrix
        run: |
          npm run sync:slv-consumer-ai
          npm run sync:slv-city-goals

      - name: Validate the refreshed six-city goal contract
        run: npm run audit:slv-city-goals

      - name: Refresh the combined portfolio and evidence-safe decisions
        run: |
          npm run sync:slv-18-city-goals
          npm run sync:slv-entity-health
          npm run sync:slv-weekly-decisions
          npm run sync:slv-gsc-attribution
          npm run sync:slv-expansion-architecture
          npm run sync:slv-execution-registry

      - name: Validate the combined portfolio and weekly decisions
        run: |
          npm run audit:slv-18-city-goals
          npm run audit:slv-consumer-ai
          npm run audit:slv-entity-health
          npm run audit:slv-weekly-decisions
          npm run audit:slv-gsc-attribution
          npm run audit:slv-expansion-architecture
          npm run audit:slv-execution-registry

      - name: Add measurement summary
        if: always()
        run: |
          while IFS= read -r report; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done < <(find data/rank-tracker -name latest.md -type f | sort)
          jq -r '"### Salt Lake Valley weekly decisions\n\n- Integrity corrections kept: \(.summary.integrityKeep)\n- Ranking lanes held for evidence: \(.summary.rankingHold)\n- Ranking keeps: \(.summary.rankingKeep)\n- Ranking reverts: \(.summary.rankingRevert)\n- Protected organic #1 queries: \(.summary.protectedOrganicNumberOneQueries)\n- Sustained cities: \(.summary.citiesAtSustainedGoal)"' data/rank-tracker/SLV-WEEKLY-DECISIONS-2026-08-12.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the complete dated panel
        run: |
          git config user.name "Frame Rank Tracker"
          git config user.email "rank-tracker@users.noreply.github.com"
          git add data/rank-tracker/
          if git diff --cached --quiet; then
            echo "No rank-tracker change to commit."
            exit 0
          fi
          TODAY=$(date -u +%F)
          git commit -m "chore(seo): SLV rank matrix ${TODAY} [cloud]"
          git push
