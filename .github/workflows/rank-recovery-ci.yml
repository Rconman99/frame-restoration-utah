name: Rank recovery contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-task-recovery:
    name: Rank measurement recovery (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: |
          node scripts/test-dataforseo-rank-tracker.mjs
          node --test scripts/test-rank-task-recovery.mjs
          node scripts/dataforseo-rank-tracker.mjs --registry data/rank-tracker/panels.json --dry-run
          node scripts/dataforseo-rank-tracker.mjs --registry data/rank-tracker/expansion-panels.json --dry-run
