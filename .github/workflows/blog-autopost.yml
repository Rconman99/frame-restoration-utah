name: Blog draft (Utah)

# Cloud-native, Mac-independent DRAFT-ONLY blog lane. The standing public-side-
# effect gate requires separate approval before publishing. Runs that produce a
# draft exercise the complete local publish
# fence in no-push mode, quarantine the manifest as needs-review, and upload it
# as an artifact. This workflow cannot push a branch, promote main, or deploy.
#
# Only secret needed: OPENROUTER_API_KEY (drafting). Repository access is
# read-only. OpenRouter billing/auth failures remain blocking and visible.

on:
  schedule:
    # Mon + Thu ~9:31am Denver (15:31 UTC in MDT; matches the retired launchd cadence).
    - cron: '31 15 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-autopost-utah
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    env:
      DRAFT_PATH: data/blog-pending/ci-draft-${{ github.run_id }}-${{ github.run_attempt }}.json
      GATE_LOG: /tmp/utah-blog-draft-gate.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pick weather + tracking target
        id: target
        run: |
          python3 scripts/blog-target-prioritizer.py --json --top 1 \
            --exclude-recent-city-days 21 > /tmp/target.json || echo '{"top":[]}' > /tmp/target.json
          COUNT=$(python3 -c 'import json;print(len(json.load(open("/tmp/target.json")).get("top",[])))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            python3 -c 'import json;t=json.load(open("/tmp/target.json"))["top"][0];print("target:",t.get("city_name"),"x",t.get("service_name"),"score",t.get("score"))'
          else
            echo "No new target this run (top cities all drafted within the exclusion window) — skipping."
          fi

      - name: Draft via OpenRouter
        id: draft
        if: steps.target.outputs.count != '0'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/blog-autobrief.py --from-prioritizer /tmp/target.json --out /tmp/brief.json
          python3 scripts/blog-draft-openrouter.py \
            --brief /tmp/brief.json \
            --out "$DRAFT_PATH" \
            --status drafted

      - name: Run HARD compliance fence and complete local gates (no push)
        id: gate
        if: steps.target.outputs.count != '0'
        run: python3 scripts/blog-publish.py --manifest "$DRAFT_PATH" 2>&1 | tee "$GATE_LOG"

      - name: Quarantine gated draft for human review
        id: quarantine
        if: ${{ always() && steps.target.outputs.count != '0' && steps.draft.outcome == 'success' }}
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          python3 - "$DRAFT_PATH" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["status"] = "needs-review"
          outcome = "passed" if os.environ.get("GATE_OUTCOME") == "success" else "failed"
          manifest.setdefault("edit_log", []).append(
              f"CI draft-only lane: local gates {outcome}; explicit approval still required"
          )
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Upload gated needs-review draft
        if: ${{ always() && steps.target.outputs.count != '0' && steps.draft.outcome == 'success' && steps.quarantine.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: utah-blog-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DRAFT_PATH }}
            ${{ env.GATE_LOG }}
          if-no-files-found: error
          retention-days: 14
