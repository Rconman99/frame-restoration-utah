name: Blog auto-post (Utah)

# Cloud-native, Mac-independent blog auto-poster (owner decision 2026-07-09:
# fully autonomous — supersedes the local launchd job com.ryan.frame-roofing-blog
# and the Wave-3 owner-merge PR flow for scheduled posts).
#
# Each run: pick the top weather+tracking target (blog-target-prioritizer, free
# NWS + in-repo PostHog snapshot) -> draft via OpenRouter (blog-draft-openrouter,
# status=drafted) -> blog-publish.py --push, which renders + runs the HARD
# compliance fence (§31A forbidden-phrase + insurance-claim cap) + structural
# gates (jsonld/links/doc-isolation/compliance-words). Clean -> unique candidate
# branch -> exact-SHA Compliance Gate -> fast-forward main -> Vercel production
# deploy. A draft that trips the fence/gates fail-closes to
# status=needs-review and is NOT published (the next run drafts a fresh target).
#
# Only secret needed: OPENROUTER_API_KEY (drafting). The gates + publish need no
# API keys; the built-in GITHUB_TOKEN (contents: write) pushes to main.

on:
  schedule:
    # Mon + Thu ~9:31am Denver (15:31 UTC in MDT; matches the retired launchd cadence).
    - cron: '31 15 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft + gate only, do NOT publish (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: blog-autopost-utah
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "Frame Blog Bot"
          git config user.email "blog-bot@users.noreply.github.com"

      - name: Pick weather + tracking target
        id: target
        run: |
          python3 scripts/blog-target-prioritizer.py --json --top 1 \
            --exclude-recent-city-days 21 > /tmp/target.json || echo '{"top":[]}' > /tmp/target.json
          COUNT=$(python3 -c 'import json;print(len(json.load(open("/tmp/target.json")).get("top",[])))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            python3 -c 'import json;t=json.load(open("/tmp/target.json"))["top"][0];print("target:",t.get("city_name"),"x",t.get("service_name"),"score",t.get("score"))'
          else
            echo "No new target this run (top cities all drafted within the exclusion window) — skipping."
          fi

      - name: Draft via OpenRouter
        if: steps.target.outputs.count != '0'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/blog-autobrief.py --from-prioritizer /tmp/target.json --out /tmp/brief.json
          python3 scripts/blog-draft-openrouter.py --brief /tmp/brief.json --status drafted

      - name: Stage candidate (HARD compliance fence + complete local gates)
        id: publish
        if: steps.target.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        env:
          CANDIDATE_BRANCH: blog-autopost-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          python3 scripts/blog-publish.py --push --push-ref "$CANDIDATE_BRANCH"
          PUBLISH_EXIT=$?
          set -e
          if [ "$PUBLISH_EXIT" -eq 3 ]; then
            echo "::warning::Draft failed its publish fence and was safely staged as needs-review"
            echo "candidate_outcome=quarantined" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_EXIT" -ne 0 ]; then
            exit "$PUBLISH_EXIT"
          else
            echo "candidate_outcome=publish" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run full Compliance Gate for the exact candidate SHA
        if: steps.publish.outputs.candidate_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ steps.publish.outputs.candidate_branch }}
        run: |
          gh workflow run compliance-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$CANDIDATE_BRANCH"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow compliance-gate.yml \
              --event workflow_dispatch --branch "$CANDIDATE_BRANCH" --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$CANDIDATE_SHA\") | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Compliance Gate did not start for candidate SHA $CANDIDATE_SHA"
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Promote the exact green candidate to main
        if: steps.publish.outputs.candidate_sha != ''
        env:
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        run: |
          git fetch origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          CANDIDATE_PARENT=$(git rev-parse "$CANDIDATE_SHA^")
          if [ "$CANDIDATE_PARENT" != "$CURRENT_MAIN" ]; then
            echo "::error::main moved after staging; refusing non-fast-forward promotion"
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$REMOTE_MAIN" != "$CANDIDATE_SHA" ]; then
            echo "::error::promotion verification failed: origin/main is not the green candidate"
            exit 1
          fi

      - name: Report candidate outcome
        if: steps.publish.outputs.candidate_sha != ''
        env:
          CANDIDATE_OUTCOME: ${{ steps.publish.outputs.candidate_outcome }}
        run: |
          if [ "$CANDIDATE_OUTCOME" = "quarantined" ]; then
            echo "::warning::The needs-review quarantine was promoted; no blog page was published"
          else
            echo "The exact green blog candidate was promoted to main."
          fi

      - name: Dry-run (manual dispatch with dry_run=true)
        if: steps.target.outputs.count != '0' && github.event.inputs.dry_run == 'true'
        run: python3 scripts/blog-publish.py
