name: Fast Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fast-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-security:
    name: Gitleaks + OSV-Scanner
    runs-on: ${{ fromJSON(vars.FRAME_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Runs before the scanners are built: the suite replaces gitleaks and
      # osv-scanner with fakes on an isolated PATH and proves the runner fails
      # closed (missing scanner, scanner finding, bad arguments) before the real
      # gate below is trusted with the PR.
      - name: Unit-test the gate runner (fake scanners, throwaway repositories)
        run: node --test scripts/run-fast-security-gate.test.mjs

      - name: Setup Go (scanners are built from source, no prebuilt binaries)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Cache Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fast-security-go-${{ runner.os }}-${{ runner.arch }}-gitleaks-v8.30.1-osv-v2.4.0

      - name: Build pinned scanners from source (module proxy + checksum database verified)
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -trimpath
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GOBIN: ${{ runner.temp }}/fast-security-tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GOBIN}"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
          "${GOBIN}/gitleaks" version
          "${GOBIN}/osv-scanner" --version
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Run blocking fast security gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${BASE_SHA}" == "${zero_sha}" ]]; then
            echo "Fast security gate requires immutable non-zero base and head SHAs." >&2
            exit 2
          fi
          node scripts/run-fast-security-gate.mjs \
            --mode changed \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --lockfiles changed
