name: Owner password recovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-security:
    name: Owner recovery security and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Test recovery requests, completion, and delivery
        run: deno test supabase/functions/lead-crm/recovery.test.ts
      - name: Test SQL permissions and concurrent credential changes
        run: bash scripts/test-owner-recovery-sql.sh
