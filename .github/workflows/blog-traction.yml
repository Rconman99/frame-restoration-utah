name: Blog traction refresh (Utah)

# Rebuilds the blog traction tracker + enhancer benchmark and commits the
# committed snapshots the /dashboard "Blog Traction" section reads:
#   data/blog-traction.json          (scripts/blog-traction.py)
#   data/blog-traction-history.jsonl (dated trend line)
#   data/blog-quality-benchmark.json (scripts/blog-enhancer.py — the bar to beat)
#   data/blog-playbook.md            (human-readable standard)
#
# Zero-secret: everything is computed from on-disk posts + the committed
# data/posthog-blog-views.json snapshot. (Refreshing that PostHog snapshot with
# live pageviews needs a PostHog personal read key and is a separate owner step;
# structural metrics, freshness, and new posts refresh here regardless.)
#
# Triggers:
#   - after every "Blog auto-post (Utah)" run, so a newly-published post enters
#     the tracker and the champion/floor ratchet immediately (no poster edit)
#   - weekly, so freshness drift + any manual post edits are picked up
#   - manual dispatch

on:
  workflow_run:
    workflows: ["Blog auto-post (Utah)"]
    types: [completed]
  schedule:
    - cron: '41 21 * * 1'   # Mondays ~15:41 Denver — hours AFTER the poster
                            # (15:31 UTC) so the two never race on a push to main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-traction-utah
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip when triggered by a FAILED poster run (workflow_run fires on every
    # completion); scheduled/manual runs have no workflow_run payload.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild traction snapshot + enhancer benchmark
        run: |
          python3 scripts/blog-traction.py
          python3 scripts/blog-enhancer.py

      - name: Commit if changed
        run: |
          git config user.name "Blog Bot"
          git config user.email "blog-bot@frameroofingutah.com"
          git add data/blog-traction.json data/blog-traction-history.jsonl \
                  data/blog-quality-benchmark.json data/blog-playbook.md
          if git diff --cached --quiet; then
            echo "no traction changes"
          else
            git commit -m "chore(blog): refresh traction snapshot + enhancer benchmark [skip ci]"
            # Rebase-retry so an overlapping poster push (both target main) can
            # never drop this refresh or the post to a non-fast-forward error.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              echo "push race, retry $i"; sleep 7
            done
            echo "push failed after retries"; exit 1
          fi
