version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Tier 1 pilot: GitHub-owned actions at patch/minor land in their own PR, which the
      # Dependabot tier gate may merge. Majors and third-party actions fall through to the
      # second group (Dependabot uses the first group that matches), which is always human.
      actions-github-owned-minor-patch:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]
      actions-other:
        patterns: ["*"]
